[project]
name = "inmindaa-geboortezorg"
version = "0.1.0"
description = "ETL pipeline and regression analysis on regional factors related to pregnancy outcomes in the Netherlands"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Exploratory notebooks: allow long plotting calls and trailing spaces inside SQL strings
"*.ipynb" = ["E501", "W291"]

[tool.ruff.lint.isort]
known-first-party = ["pandas_scripts", "excel_scripts"]

[tool.ruff.format]
exclude = ["*.ipynb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
